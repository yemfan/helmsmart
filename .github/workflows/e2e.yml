# Playwright E2E — calculator test suite against propertytoolsai.
#
# Scope per validation report QA-02: deterministic regression coverage on
# the five primary calculators. Runs on PR + push to main. Uses pnpm for
# parity with the dev/build pipeline.

name: E2E — Calculators

on:
  pull_request:
    paths:
      - "apps/propertytoolsai/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium + mobile-safari)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/propertytoolsai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # `pnpm/action-setup@v4` errors out when pnpm version is specified in
        # both the action's `with.version` AND `package.json#packageManager`.
        # The root `package.json` has `"packageManager": "pnpm@9.15.5"`, which
        # is the canonical version source — let the action read it from there
        # so the CI version always matches the dev/build pipeline exactly.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        env:
          # Disable network-dependent features during tests.
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          # Stub Supabase env so calculator pages don't 500 on the
          # `requireSupabasePublicEnv()` throw guard during render.
          # Calculators are pure math (client-side); the only reason
          # these vars are needed at all is the analytics +
          # agent-assignment API routes called from page boilerplate.
          # Real values would let those routes succeed — stubs just
          # let createClient() get past init; real Supabase calls
          # would fail with a normal error response, not a thrown
          # 500 that spams the log and slows the page enough to time
          # out the test cap.
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.stub.stub
        run: pnpm test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: apps/propertytoolsai/playwright-report/
          retention-days: 14
