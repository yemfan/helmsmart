<svg viewBox="0 0 940 240" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="RealtorBoss - Your AI Real Estate Team">
  <!-- RealtorBoss horizontal lockup: six-point house mark + two-tone wordmark + tagline.
       Text uses a web-safe geometric-sans stack; in-app, prefer the
       RealtorBossLogo React component (renders with the app font). -->
  <g transform="translate(20 20)">
    <rect width="200" height="200" rx="44" fill="#CFE5FA"/>
    <path d="M100 46 L52 90 L52 152 L148 152 L148 90 Z" fill="#0B1F44" stroke="#0B1F44" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <g stroke="#E8CC78" stroke-width="4" opacity="0.85">
      <line x1="100" y1="112" x2="100" y2="46"/>
      <line x1="100" y1="112" x2="52" y2="90"/>
      <line x1="100" y1="112" x2="148" y2="90"/>
      <line x1="100" y1="112" x2="52" y2="152"/>
      <line x1="100" y1="112" x2="148" y2="152"/>
    </g>
    <g fill="#D4A017">
      <circle cx="100" cy="46" r="9"/>
      <circle cx="52" cy="90" r="9"/>
      <circle cx="148" cy="90" r="9"/>
      <circle cx="52" cy="152" r="9"/>
      <circle cx="148" cy="152" r="9"/>
    </g>
    <circle cx="100" cy="112" r="23" fill="#D4A017"/>
    <text x="100" y="123" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#0B1F44">R</text>
  </g>
  <text x="262" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="100" letter-spacing="-2">
    <tspan fill="#0B1F44">Realtor</tspan><tspan fill="#D4A017">Boss</tspan>
  </text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <line x1="287" y1="166" x2="333" y2="166" stroke="#D4A017" stroke-width="4" />
    <text x="531" y="176" text-anchor="middle" fill="#0B1F44" font-weight="600" font-size="25" letter-spacing="1.5">YOUR AI REAL ESTATE TEAM</text>
    <line x1="729" y1="166" x2="775" y2="166" stroke="#D4A017" stroke-width="4" />
  </g>
</svg>
