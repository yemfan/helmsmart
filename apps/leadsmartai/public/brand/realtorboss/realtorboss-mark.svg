<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="RealtorBoss">
  <!--
    RealtorBoss mark - a house built from six points: five teammates
    (Receptionist, Sales, Marketing, Transaction, Accountant) wired to a
    central Boss hub. Navy #0B1F44 outline, gold #D4A017 nodes + connectors.
    Transparent background - for light surfaces and the wordmark lockup.
  -->
  <path d="M100 46 L52 90 L52 152 L148 152 L148 90 Z" stroke="#0B1F44" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <g stroke="#D4A017" stroke-width="4" opacity="0.6">
    <line x1="100" y1="112" x2="100" y2="46"/>
    <line x1="100" y1="112" x2="52" y2="90"/>
    <line x1="100" y1="112" x2="148" y2="90"/>
    <line x1="100" y1="112" x2="52" y2="152"/>
    <line x1="100" y1="112" x2="148" y2="152"/>
  </g>
  <g fill="#D4A017">
    <circle cx="100" cy="46" r="9"/>
    <circle cx="52" cy="90" r="9"/>
    <circle cx="148" cy="90" r="9"/>
    <circle cx="52" cy="152" r="9"/>
    <circle cx="148" cy="152" r="9"/>
    <circle cx="100" cy="112" r="11.5"/>
  </g>
</svg>
